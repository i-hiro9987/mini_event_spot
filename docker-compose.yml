version: '3.8'

services:
  db:
    image: postgres:14
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails server -b 0.0.0.0"
    volumes:
      - .:/app
      - bundle_cache:/app/vendor/bundle
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment: 
      DATABASE_URL: postgresql://postgres:password@db:5432/mini_event_spot_development
      DATABASE_URL_TEST: postgresql://postgres:password@db:5432/mini_event_spot_test
    depends_on:
      - db
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  bundle_cache:
  node_modules: